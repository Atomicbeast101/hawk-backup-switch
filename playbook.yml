---
# https://github.com/wpacket/pan-ansible/blob/master/pan_config_pull.yml
- name: Backup Config from HP Switch
  hosts: all
  gather_facts: no
  collections:
    - arubanetworks.aos_switch
  vars:
    # HP Switch
    ansible_user: "{{ lookup('ansible.builtin.env', 'SWITCH_USERNAME') }}"
    ansible_password: "{{ lookup('ansible.builtin.env', 'SWITCH_PASSWORD') }}"
    ansible_network_os: arubanetworks.aos_switch.arubaoss
    ansible_connection: network_cli
    ansible_command_timeout: 30
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" # Prevents built-in SSH key validation as it's using standard username/password to access it
    # SFTP Server
    sftp_host: "{{ lookup('ansible.builtin.env', 'SFTP_HOST') }}"
    sftp_port: "{{ lookup('ansible.builtin.env', 'SFTP_PORT') }}"
    sftp_username: "{{ lookup('ansible.builtin.env', 'SFTP_USERNAME') }}"
    sftp_password: "{{ lookup('ansible.builtin.env', 'SFTP_PASSWORD') }}"
    sftp_path: "{{ lookup('ansible.builtin.env', 'SFTP_PATH') }}"
    # Pushover
    pushover_user: "{{ lookup('ansible.builtin.env', 'PUSHOVER_USER_KEY') }}"
    pushover_token: "{{ lookup('ansible.builtin.env', 'PUSHOVER_APP_TOKEN') }}"
    # Cleanup Old Backups
    backup_retention_in_days: "{{ lookup('ansible.builtin.env', 'BACKUP_RETENTION_IN_DAYS', default=10) | int }}"
  tasks:
    - name: Perform Backup
      block:
        - name: Create Config File Path
          ansible.builtin.set_fact:
            backup_config_file: "{{ inventory_hostname }}__config__{{ now().strftime('%Y.%m.%d') }}.cfg"

        - name: Create .downloads/ Directory
          delegate_to: localhost
          ansible.builtin.file:
            path: .downloads/
            state: directory
            mode: '0755'

        #### NOTE: This does not work in Docker environment, switching to a different solution (found after this task) instead ####
        # - name: Backup & Download Config File
        #   arubanetworks.aos_switch.arubaoss_config:
        #     backup: True
        #     backup_options:
        #       filename: "{{ backup_config_file }}"
        #       dir_path: .downloads/
        #### NOTE: This does not work in Docker environment, switching to a different solution (found after this task) instead ####

        - name: Load Config Data
          arubanetworks.aos_switch.arubaoss_command:
            commands: ['show running-config']
          register: config_data

        - name: Write Config Variable to File
          copy:
            content: "{{ config_data.stdout[0] | replace('\\n', '\n') }}"
            dest: ".downloads/{{ backup_config_file }}"

        - name: Upload Config to SFTP
          delegate_to: localhost
          ansible.builtin.shell: "echo 'put .downloads/{{ backup_config_file }}' | sshpass -p '{{ sftp_password }}' sftp -o StrictHostKeyChecking=no -P {{ sftp_port }} {{ sftp_username }}@{{ sftp_host }}:{{ sftp_path }}"

        - name: Delete Config File Locally
          delegate_to: localhost
          ansible.builtin.file:
            path: ".downloads/{{ backup_config_file }}"
            state: absent

      rescue:
        - name: Notify Admin of Failed Backup
          delegate_to: localhost
          ansible.builtin.uri:
            url: https://api.pushover.net/1/messages.json
            method: POST
            headers: 
              Content-Type: application/json
            body_format: json
            body:
              user: "{{ pushover_user }}"
              token: "{{ pushover_token }}"
              message: "❌ Unable to perform config backup for {{ inventory_hostname }}!"

        - name: Stop Playbook
          ansible.builtin.fail:
            msg: Forced playbook to stop to prevent backup cleanup activity from happening.

    - name: Cleanup Old Backups
      block:
        - name: Get Cutoff Epoch
          set_fact:
            cutoff_epoch: "{{ lookup('pipe', 'date +%s') | int - (backup_retention_in_days * 86400) }}"

        - name: Get Cutoff Date
          set_fact:
            cutoff_date: "{{ '%Y-%m-%d' | strftime(cutoff_epoch) | to_datetime('%Y-%m-%d') }}"

        - name: Removing Any Files Older than this Date
          debug:
            msg: "{{ cutoff_date }}"

        - name: Get Files from SFTP
          delegate_to: localhost
          ansible.builtin.shell: "echo 'ls -l' | sshpass -p '{{ sftp_password }}' sftp -o StrictHostKeyChecking=no -P {{ sftp_port }} {{ sftp_username }}@{{ sftp_host }}:{{ sftp_path }}"
          register: sftp_files
          changed_when: false

        - name: Backup Files Found from SFTP
          debug:
            msg: "{{ sftp_files.stdout_lines | map('split', ' ') | map('last') | select('match', '^' + inventory_hostname + '__config__') }}"
        
        - name: Create List of Files with Dates
          set_fact: 
            sftp_files_with_dates: >-
              {{
                sftp_files_with_dates | default([]) + [{
                  'file': item,
                  'date': (item | replace(inventory_hostname + '__config__', '') | replace('.cfg', '') | to_datetime('%Y.%m.%d'))
                }]
              }}
          loop: "{{ sftp_files.stdout_lines | map('split', ' ') | map('last') | select('match', '^' + inventory_hostname + '__config__') }}"

        - name: "Find Files Older than {{ backup_retention_in_days }} Days"
          set_fact:
            old_sftp_files: >-
              {{
                sftp_files_with_dates
                | selectattr('date', 'defined')
                | selectattr('date', 'le', cutoff_date)
                | list
              }}

        - name: Will Be Removing These Old Backup Files
          debug:
            msg: "{{ old_sftp_files | map(attribute='file') | list }}"
        
        - name: Remove Old Backup Files from SFTP
          delegate_to: localhost
          ansible.builtin.shell: "echo 'rm {{ item.file }}' | sshpass -p '{{ sftp_password }}' sftp -o StrictHostKeyChecking=no -P {{ sftp_port }} {{ sftp_username }}@{{ sftp_host }}:{{ sftp_path }}"
          loop: "{{ old_sftp_files }}"

      rescue:
        - name: Notify Admin of Failed Backup Cleanup
          delegate_to: localhost
          ansible.builtin.uri:
            url: https://api.pushover.net/1/messages.json
            method: POST
            headers: 
              Content-Type: application/json
            body_format: json
            body:
              user: "{{ pushover_user }}"
              token: "{{ pushover_token }}"
              message: "❌ Unable to perform backup cleanup activity for {{ inventory_hostname }}!"
